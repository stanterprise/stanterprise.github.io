{{/* Global Mermaid bootstrap for pages that include Mermaid blocks. */}}
<script type="module">
  const mermaidNodes = document.querySelectorAll(".mermaid, pre.mermaid");
  if (mermaidNodes.length === 0) {
    // No Mermaid diagrams on this page.
  } else if (!window.__observerMermaidInitialized) {
    const { default: mermaid } =
      await import("https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.esm.min.mjs");
    mermaid.initialize({ startOnLoad: false });
    await mermaid.run({ querySelector: ".mermaid, pre.mermaid" });
    window.__observerMermaidInitialized = true;
  }
</script>
