baseURL: https://stanterprise.github.io/
languageCode: en-us
title: Observer
theme: docsy

# Language settings
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
enableMissingTranslationPlaceholders: true

# Highlighting config
pygmentsCodeFences: true
pygmentsUseClasses: false
pygmentsUseClassic: false
pygmentsStyle: tango

# Configure how URLs are generated
[permalinks]
blog = "/:section/:year/:month/:day/:slug/"

# Image processing configuration
[imaging]
resampleFilter: CatmullRom
quality: 75
anchor: smart

# Language configuration
[languages]
[languages.en]
title: Observer
languageName: English
weight: 1

[languages.en.params]
description: Developer tool for observability

# Markup configuration
[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe: true
[markup.highlight]
style: tango
[markup.tableOfContents]
endLevel: 3
ordered: false
startLevel: 2

# Enable Mermaid
[params.mermaid]
enable: true

# Module configuration for Docsy
[module]
proxy: direct
[[module.imports]]
path: github.com/google/docsy
disable: false
[[module.imports.mounts]]
source: assets
target: assets
[[module.imports.mounts]]
source: node_modules/bootstrap/dist
target: assets/vendor/bootstrap
[[module.imports.mounts]]
source: node_modules/@fortawesome/fontawesome-free
target: assets/vendor/Font-Awesome
[[module.imports.mounts]]
source: i18n
target: i18n
[[module.imports.mounts]]
source: layouts
target: layouts
[[module.imports.mounts]]
source: static
target: static
[[module.imports.mounts]]
source: node_modules/@fortawesome/fontawesome-free/webfonts
target: static/webfonts
[[module.imports]]
path: github.com/google/docsy/dependencies
disable: false

# Site Params
[params]
copyright: Observer
privacy_policy: ""

# GitHub repo configuration for "Edit this page" links
github_repo: https://github.com/stanterprise/stanterprise.github.io
github_branch: main

# Enable "Edit this page" link
github_project_repo: https://github.com/stanterprise/stanterprise.github.io

# UI customization
[params.ui]
sidebar_menu_compact: true
breadcrumb_disable: false
sidebar_search_disable: false
navbar_logo: true
footer_about_disable: false

# Repository links
[params.links]
[[params.links.developer]]
name: GitHub
url: https://github.com/stanterprise/stanterprise.github.io
icon: fab fa-github
desc: Development takes place here!

# Top-level navigation
[menu]
[[menu.main]]
name: Docs
weight: 10
url: /docs/
[[menu.main]]
name: Architecture
weight: 20
url: /docs/architecture/
[[menu.main]]
name: Integrations
weight: 30
url: /docs/integrations/
[[menu.main]]
name: Demo
weight: 40
url: /docs/demo/
[[menu.main]]
name: Community
weight: 50
url: /community/
[[menu.main]]
name: GitHub
weight: 60
url: https://github.com/stanterprise/stanterprise.github.io
pre: <i class='fab fa-github'></i>

# Build configuration
[build]
writeStats: true
